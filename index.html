<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyraNet Italia - Monitoraggio Incendi</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body { margin: 0; padding: 0; }
        #mappa { height: 100vh; width: 100%; } 
    </style>
</head>
<body>

    <div id="mappa"></div>

    <script>
        // Inizializza la mappa sull'Italia
        var map = L.map('mappa').setView([41.8719, 12.5674], 6);

        // Aggiunge la cartografia di base
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // La tua chiave API e l'URL per scaricare i dati italiani (ITA) delle ultime 24 ore dal satellite VIIRS
        const apiKey = '6c7f29542d837e182b0bf7292cb52b99';
        const urlNasa = `https://firms.modaps.eosdis.nasa.gov/api/country/csv/${apiKey}/VIIRS_SNPP_NRT/ITA/1`;

        // Funzione per recuperare i dati
        fetch(urlNasa)
            .then(response => response.text()) // La NASA ci restituisce un file di testo (CSV)
            .then(datiCsv => {
                // Dividiamo il testo riga per riga
                const righe = datiCsv.trim().split('\n');
                
                // Partiamo da 1 per saltare la primissima riga (che contiene solo i titoli delle colonne)
                for (let i = 1; i < righe.length; i++) {
                    const colonne = righe[i].split(',');
                    
                    // Nel formato NASA per nazioni: 
                    // colonna[0] = Nazione (es. ITA)
                    // colonna[1] = Latitudine
                    // colonna[2] = Longitudine
                    const lat = parseFloat(colonne[1]);
                    const lon = parseFloat(colonne[2]);
                    
                    // Se i dati sono validi, creiamo un cerchio rosso sulla mappa
                    if (!isNaN(lat) && !isNaN(lon)) {
                        L.circle([lat, lon], {
                            color: 'red',       // Colore del bordo
                            fillColor: '#f03',  // Colore del riempimento
                            fillOpacity: 0.7,   // Trasparenza
                            radius: 1500        // Raggio in metri (1.5 km)
                        }).addTo(map)
                        .bindPopup("Anomalia termica rilevata (Dati: NASA FIRMS)");
                    }
                }
            })
            .catch(errore => {
                console.error("Si è verificato un errore nel caricamento dei dati NASA:", errore);
            });
    </script>
</body>
</html>
